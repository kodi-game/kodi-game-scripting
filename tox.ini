[tox]

# Python environments
envlist = py39, py310, py311, py312, py313

skip_missing_interpreters = true

[flake8]

ignore =
    # Ignore over-indented line continuations (conflicts with pylint)
    E126,

    # One blank line after a function def is FINE
    E302,

    # Sometimes, multiple import on one line look better/make sense
    E401,

    # Don't care about module-level imports. we generally keep 'em *towards* the top ;)
    E402,

    # Ignore line length errors
    E501,

    # This is changing, so ignore it for now
    W503,

    # Ignore line breaks after binary operators
    W504,

exclude =
    .git
    .tox
    *lib/python*
    test_data
    working_directory/

[pytest]

python_files = *.py

norecursedirs =
    .*
    build
    dist
    *.egg
    venv
    test_data
    working_directory

[testenv]

passenv = GITHUB_ACCESS_TOKEN

# pytest-flake8 and pytest-pylint are both unmaintained and don't work with
# current pytest, so the linters run as their own commands instead
deps = pytest
       pytest-mock
       pytest-cov
       flake8
       pylint

commands = pytest {posargs} --junitxml=junit-{envname}.xml \
                            --cov=kodi_game_scripting \
                            --cov-config=.coveragerc \
                            --cov-branch \
                            --cov-report=term-missing \
                            --cov-report=html
           flake8 kodi_game_scripting tests
           pylint kodi_game_scripting tests
