#
# Parameters:
#
#   Secret files:
#     * privateKey - the SSH private key used to push to kodi-game repos
#
#   Git authorship:
#     * TODO: Parameterize git authorship
#

# TODO: Run as a cron job
trigger:
  - todo-disabled-for-now

jobs:
  - template: .azure/job-template.yml
    parameters:
      displayName: "BuildAll"
      vmImage: 'ubuntu-24.04'
      pythonVersion: '3.10'
      installScript: |
        # OpenGL cores
        dpkg -s mesa-common-dev || sudo apt install -y mesa-common-dev

        # N64 cores
        dpkg -s nasm || sudo apt install -y nasm

        # 3dengine
        dpkg -s libvulkan-dev || sudo apt install -y libvulkan-dev

        # beetle-psx-hw
        dpkg -s libgl-dev || sudo apt install libgl-dev

        # cemu
        dpkg -s glslang-dev || sudo apt install -y glslang-dev
        dpkg -s glslang-tools || sudo apt install -y glslang-tools
        dpkg -s libboost-filesystem-dev || sudo apt install -y libboost-filesystem-dev
        dpkg -s libboost-nowide-dev || sudo apt install -y libboost-nowide-dev
        dpkg -s libboost-program-options-dev || sudo apt install -y libboost-program-options-dev
        dpkg -s libcurl4-openssl-dev || sudo apt install -y libcurl4-openssl-dev
        dpkg -s libegl-dev || sudo apt install -y libegl-dev
        dpkg -s libfmt-dev || sudo apt install -y libfmt-dev
        dpkg -s libglm-dev || sudo apt install -y libglm-dev
        dpkg -s libpng-dev || sudo apt install -y libpng-dev
        dpkg -s libpugixml-dev || sudo apt install -y libpugixml-dev
        dpkg -s libssl-dev || sudo apt install -y libssl-dev
        dpkg -s libx11-dev || sudo apt install -y libx11-dev
        dpkg -s libxrender-dev || sudo apt install -y libxrender-dev
        dpkg -s libzip-dev || sudo apt install -y libzip-dev
        dpkg -s libzstd-dev || sudo apt install -y libzstd-dev
        dpkg -s rapidjson-dev || sudo apt install -y rapidjson-dev
        dpkg -s zipcmp || sudo apt install -y zipcmp
        dpkg -s zipmerge || sudo apt install -y zipmerge
        dpkg -s ziptool || sudo apt install -y ziptool

        # desmume
        dpkg -s libpcap-dev || sudo apt install -y libpcap-dev

        # dolphin
        dpkg -s libegl1-mesa-dev || sudo apt install libegl1-mesa-dev
        dpkg -s libudev-dev || sudo apt install -y libudev-dev
        dpkg -s libusb-1.0-0-dev || sudo apt install -y libusb-1.0-0-dev
        dpkg -s libxi-dev || sudo apt install -y libxi-dev
        dpkg -s libxrandr-dev || sudo apt install -y libxrandr-dev

        # dosbox
        dpkg -s autoconf || sudo apt install -y autoconf
        dpkg -s automake || sudo apt install -y automake
        dpkg -s libasound2-dev || sudo apt install -y libasound2-dev
        dpkg -s libtool-bin || sudo apt install -y libtool-bin
        dpkg -s ninja-build || sudo apt install -y ninja-build

        # easyrpg
        dpkg -s libfmt-dev || sudo apt install -y libfmt-dev
        dpkg -s libinih-dev || sudo apt install -y libinih-dev
        dpkg -s libpixman-1-dev || sudo apt install -y libpixman-1-dev
        dpkg -s libpng-dev || sudo apt install -y libpng-dev

        # fsuae
        dpkg -s libglib2.0-dev || sudo apt install -y libglib2.0-dev
        dpkg -s libmpeg2-4-dev || sudo apt install -y libmpeg2-4-dev

        # fuse
        #dpkg -s libglib2.0-dev || sudo apt install -y libglib2.0-dev

        # moonlight
        #dpkg -s libavcodec-dev || sudo apt install -y libavcodec-dev
        #dpkg -s libavdevice-dev || sudo apt install -y libavdevice-dev
        #dpkg -s libavformat-dev || sudo apt install -y libavformat-dev
        #dpkg -s libcurl4-openssl-dev || sudo apt install -y libcurl4-openssl-dev
        #dpkg -s libgl-dev || sudo apt install -y libgl-dev
        #dpkg -s libopus-dev || sudo apt install -y libopus-dev

        # parallext
        dpkg -s libpng-dev || sudo apt install -y libpng-dev
